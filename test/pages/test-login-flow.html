<!DOCTYPE html>
<html>
<head>
    <title>Test Login Flow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .step { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Login Flow</h1>
    
    <div class="step">
        <h3>Step 1: Test Google Auth API</h3>
        <button onclick="testGoogleAuth()">Test Google Auth</button>
        <div id="googleAuthResult"></div>
    </div>
    
    <div class="step">
        <h3>Step 2: Test Registration API</h3>
        <button onclick="testRegistration()">Test Registration</button>
        <div id="registrationResult"></div>
    </div>
    
    <div class="step">
        <h3>Step 3: Check Database</h3>
        <button onclick="checkDatabase()">Check Database</button>
        <div id="databaseResult"></div>
    </div>

    <script>
        async function testGoogleAuth() {
            const resultDiv = document.getElementById('googleAuthResult');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                // Simulate a Google credential (this won't work but will test the API)
                const response = await fetch('/api/google-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: 'test.credential.token' })
                });
                
                const data = await response.json();
                resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                resultDiv.className = 'step ' + (response.ok ? 'success' : 'error');
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                resultDiv.className = 'step error';
            }
        }
        
        async function testRegistration() {
            const resultDiv = document.getElementById('registrationResult');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        tradeType: 'builder',
                        businessName: 'Test Business',
                        phone: '123456789',
                        location: 'Test Location'
                    })
                });
                
                const data = await response.json();
                resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                resultDiv.className = 'step ' + (response.ok ? 'success' : 'error');
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                resultDiv.className = 'step error';
            }
        }
        
        async function checkDatabase() {
            const resultDiv = document.getElementById('databaseResult');
            resultDiv.innerHTML = 'Checking...';
            
            try {
                const response = await fetch('/api/debug');
                const data = await response.json();
                resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                resultDiv.className = 'step ' + (response.ok ? 'success' : 'error');
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                resultDiv.className = 'step error';
            }
        }
    </script>
</body>
</html>
