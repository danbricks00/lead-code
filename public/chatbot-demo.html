<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwi Trade Chatbot Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .demo-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            height: 600px;
            display: flex;
            flex-direction: column;
        }

        .demo-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .demo-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .demo-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        /* Chatbot Styles */
        .chatbot {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chatbot-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 0;
        }

        .chatbot-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .chatbot-buttons {
            display: flex;
            gap: 5px;
        }

        .chatbot-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chatbot-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .chatbot-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #fafafa;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 85%;
            font-size: 14px;
        }

        .bot-message {
            background: white;
            align-self: flex-start;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .user-message {
            background-color: #1a73e8 !important; /* A slightly different blue */
            color: white !important;
            margin-left: auto;
            align-self: flex-end;
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.3);
            border: none !important;
            color-scheme: light !important; /* This is the key: tells Chrome to leave this element alone */
        }

        /* Extra override for dark mode specifically */
        @media (prefers-color-scheme: dark) {
            .user-message, div.user-message, .message.user-message {
                background-color: #1a73e8 !important;
                color: white !important;
            }
        }

        /* Force user message styling in all color schemes */
        .message.user-message {
            background: #007bff !important;
            background-color: #007bff !important;
            color: white !important;
        }

        /* Override any Chrome theme or system colors */
        .user-message,
        div.user-message,
        .message.user-message,
        div.message.user-message {
            background: #007bff !important;
            background-color: #007bff !important;
            color: white !important;
            border: none !important;
        }

        /* Override autofill and system colors */
        .user-message:-webkit-autofill,
        .user-message:-webkit-autofill:hover,
        .user-message:-webkit-autofill:focus {
            background: #007bff !important;
            background-color: #007bff !important;
            color: white !important;
        }

        /* Progress Bar and Checklist */
        .chatbot-progress {
            padding: 12px 15px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-ticks {
            display: flex;
            justify-content: space-between;
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 11px;
        }

        .tick {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #999;
            transition: color 0.3s ease;
        }

        .tick.completed {
            color: #667eea;
            font-weight: 600;
        }

        .tick-icon {
            font-size: 14px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .tick.completed .tick-icon {
            opacity: 1;
        }

        .tick-text {
            white-space: nowrap;
        }

        .chatbot-input {
            padding: 15px;
            border-top: 1px solid #eee;
            background: white;
            display: flex;
            gap: 10px;
        }

        .chatbot-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }

        .chatbot-input button {
            width: 35px;
            height: 35px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .demo-container {
                height: 100vh;
                border-radius: 0;
                max-width: none;
            }
            
            .progress-ticks {
                flex-direction: column;
                gap: 5px;
                align-items: flex-start;
            }
            
            .tick {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-header">
            <h1>Kiwi Trade Chatbot</h1>
            <p>Enhanced with Progress Bar & Checklist</p>
        </div>

        <!-- Chatbot -->
        <div class="chatbot">
            <div class="chatbot-header">
                <div class="chatbot-title">Kiwi Trade Chatbot</div>
                <div class="chatbot-buttons">
                    <button id="minimize-btn" class="chatbot-btn">−</button>
                    <button id="close-btn" class="chatbot-btn">×</button>
                </div>
            </div>
            <div class="chatbot-messages" id="chatMessages">
                <div class="message bot-message">👋 Welcome to Kiwi Trade! We'll ask a couple of quick questions to prepare your underfloor heating quote.</div>
            </div>
            
            <!-- Progress Bar and Checklist -->
            <div class="chatbot-progress">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
                <ul class="progress-ticks" id="progress-ticks">
                    <li class="tick" data-step="room-details">
                        <span class="tick-icon">✓</span>
                        <span class="tick-text">Room Details</span>
                    </li>
                    <li class="tick" data-step="timeframe">
                        <span class="tick-icon">✓</span>
                        <span class="tick-text">Timeframe</span>
                    </li>
                    <li class="tick" data-step="personal-details">
                        <span class="tick-icon">✓</span>
                        <span class="tick-text">Personal Details</span>
                    </li>
                    <li class="tick" data-step="quote-sent">
                        <span class="tick-icon">✓</span>
                        <span class="tick-text">Quote Sent</span>
                    </li>
                </ul>
            </div>
            
            <div class="chatbot-input">
                <input type="text" id="chatInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Enhanced Chatbot with Progress Tracking
        const steps = ["Room Details", "Timeframe", "Personal Details", "Quote Sent"];
        let currentStep = 0;
        let totalRooms = 0;
        let currentRoom = 0;
        let roomDetails = [];
        
        let chatState = {
            step: 'welcome',
            customerName: '',
            customerEmail: '',
            customerPhone: '',
            location: '',
            areasCount: '',
            areaSizes: '',
            timeframe: ''
        };

        function updateProgress() {
            const progress = (currentStep / steps.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';

            const ticks = document.querySelectorAll('.tick');
            ticks.forEach((tick, index) => {
                if (index < currentStep) {
                    tick.classList.add('completed');
                } else {
                    tick.classList.remove('completed');
                }
            });
        }

        function startChat() {
            console.log('Starting chat...');
            chatState.step = 'areas_count';
            currentStep = 0;
            updateProgress();
            addMessage('How many areas are you planning to install underfloor heating in?');
        }

        function addMessage(message, isUser = false) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            messageDiv.textContent = message;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            addMessage(message, true);
            input.value = '';
            processUserMessage(message);
        }

        // Smart dimension parsing function
        function parseDimensions(input) {
            const cleanInput = input.toLowerCase().replace(/[^\d\.\sx]/g, '').trim();
            
            // Pattern 1: Direct square meters (e.g., "25", "25.5", "25 sqm")
            const directSqmMatch = cleanInput.match(/^(\d+\.?\d*)\s*$/);
            if (directSqmMatch) {
                const sqm = parseFloat(directSqmMatch[1]);
                return {
                    originalInput: input,
                    sqm: sqm,
                    dimensions: null,
                    format: 'direct_sqm'
                };
            }
            
            // Pattern 2: Dimensions (e.g., "10 x 5", "7.07 x 7.07", "4m x 3m")
            const dimensionMatch = cleanInput.match(/(\d+\.?\d*)\s*x\s*(\d+\.?\d*)/);
            if (dimensionMatch) {
                const width = parseFloat(dimensionMatch[1]);
                const length = parseFloat(dimensionMatch[2]);
                const sqm = width * length;
                return {
                    originalInput: input,
                    sqm: sqm,
                    dimensions: { width, length },
                    format: 'dimensions'
                };
            }
            
            return null; // Invalid format
        }

        function processUserMessage(message) {
            setTimeout(() => {
                switch (chatState.step) {
                    case 'areas_count':
                        const roomCount = parseInt(message);
                        if (isNaN(roomCount) || roomCount < 1) {
                            addMessage('Please enter a valid number of areas (e.g., 1, 2, 3).');
                            return;
                        }
                        totalRooms = roomCount;
                        currentRoom = 0;
                        roomDetails = [];
                        chatState.areasCount = message;
                        chatState.step = 'room_details';
                        currentStep = 0; // Start room details phase
                        updateProgress();
                        handleRoomDetails();
                        break;
                        
                    case 'room_details':
                        if (currentRoom < totalRooms) {
                            // Collect room name
                            if (!roomDetails[currentRoom]) {
                                roomDetails[currentRoom] = { name: message };
                                addMessage(`What are the dimensions of the ${message}?
                                
You can enter:
• Direct square meters: "25" or "25.5"
• Length x Width: "10 x 5" or "7.07 x 7.07"
• With units: "4m x 3m" or "25 sqm"`);
                            } else {
                                // Parse room dimensions intelligently
                                const parsed = parseDimensions(message);
                                
                                if (!parsed) {
                                    addMessage(`Sorry, I couldn't understand that format. Please try:
• Direct square meters: "25" or "25.5"
• Length x Width: "10 x 5" or "7.07 x 7.07"
• With units: "4m x 3m" or "25 sqm"`);
                                    return;
                                }
                                
                                // Store structured data
                                roomDetails[currentRoom].dimensions = parsed.originalInput;
                                roomDetails[currentRoom].sqm = parsed.sqm;
                                roomDetails[currentRoom].parsedDimensions = parsed.dimensions;
                                roomDetails[currentRoom].format = parsed.format;
                                
                                // Provide confirmation
                                if (parsed.format === 'direct_sqm') {
                                    addMessage(`✅ ${roomDetails[currentRoom].name}: ${parsed.sqm} square meters`);
                                } else {
                                    addMessage(`✅ ${roomDetails[currentRoom].name}: ${parsed.dimensions.width}m x ${parsed.dimensions.length}m = ${parsed.sqm} square meters`);
                                }
                                
                                currentRoom++;
                                
                                if (currentRoom < totalRooms) {
                                    setTimeout(() => {
                                        addMessage(`What's the name of room ${currentRoom + 1}?`);
                                    }, 1000);
                                } else {
                                    // Calculate total and move to timeframe
                                    const totalSqm = roomDetails.reduce((sum, room) => sum + room.sqm, 0);
                                    setTimeout(() => {
                                        addMessage(`Perfect! Total area: ${totalSqm.toFixed(1)} square meters across ${totalRooms} room(s).`);
                                        setTimeout(() => {
                                            chatState.step = 'timeframe';
                                            currentStep = 1;
                                            updateProgress();
                                            addMessage("What's your preferred timeframe for this project?");
                                        }, 2000);
                                    }, 1000);
                                }
                            }
                        }
                        break;
                        
                    case 'timeframe':
                        chatState.timeframe = message;
                        chatState.step = 'collect_details_intro';
                        addMessage("Before we notify a tradie about your project enquiry, can you please enter your personal details so we can find a tradie who can service your area and your needs.");
                        setTimeout(() => {
                            chatState.step = 'customer_name';
                            currentStep = 2; // Personal details phase
                            updateProgress();
                            addMessage("What's your name?");
                        }, 3000);
                        break;
                        
                    case 'customer_name':
                        chatState.customerName = message;
                        chatState.step = 'customer_phone';
                        setTimeout(() => {
                            addMessage("What's your phone number?");
                        }, 1500);
                        break;
                        
                    case 'customer_phone':
                        chatState.customerPhone = message;
                        chatState.step = 'location';
                        setTimeout(() => {
                            addMessage("What's the address of the job?");
                        }, 1500);
                        break;
                        
                    case 'location':
                        chatState.location = message;
                        chatState.step = 'customer_email';
                        setTimeout(() => {
                            addMessage("Finally, what's your email address?");
                        }, 1500);
                        break;
                        
                    case 'customer_email':
                        chatState.customerEmail = message;
                        currentStep = 3; // Quote sent phase
                        updateProgress();
                        setTimeout(() => {
                            generateLead();
                        }, 1000);
                        break;
                        
                    default:
                        addMessage("I'm not sure I understand. Could you please clarify?");
                }
            }, 800);
        }

        function handleRoomDetails() {
            if (currentRoom < totalRooms) {
                addMessage(`What's the name of room ${currentRoom + 1}?`);
            }
        }

        function generateLead() {
            addMessage("Thank you! Your details have been sent for a quote. A qualified tradesman will contact you within 24 hours.");
            
            // Calculate total square meters
            const totalSqm = roomDetails.reduce((sum, room) => sum + room.sqm, 0);
            
            // Format room details for display
            const roomDetailsText = roomDetails.map(room => {
                if (room.format === 'direct_sqm') {
                    return `${room.name}: ${room.sqm}m²`;
                } else {
                    return `${room.name}: ${room.parsedDimensions.width}m x ${room.parsedDimensions.length}m (${room.sqm}m²)`;
                }
            }).join(', ');
            
            // Create structured room data for quote automation
            const structuredRooms = roomDetails.map(room => ({
                name: room.name,
                originalInput: room.dimensions,
                sqm: room.sqm,
                dimensions: room.parsedDimensions,
                format: room.format
            }));
            
            console.log('Enhanced Lead Data:', {
                customerName: chatState.customerName,
                customerEmail: chatState.customerEmail,
                customerPhone: chatState.customerPhone,
                selectedService: 'underfloor_heating',
                projectDetails: `Underfloor heating installation - ${totalRooms} room(s): ${roomDetailsText}`,
                projectSize: `${totalSqm.toFixed(1)} square meters total`,
                location: chatState.location,
                areasCount: totalRooms.toString(),
                areaSizes: roomDetailsText,
                totalSquareMeters: totalSqm.toFixed(1),
                rooms: structuredRooms, // Structured data for automation
                roomsJson: JSON.stringify(structuredRooms), // For easy database storage
                budget: 'To be quoted',
                timeline: chatState.timeframe || 'Flexible',
                specificDetails: `Customer requires underfloor heating installation for ${totalRooms} room(s). Total area: ${totalSqm.toFixed(1)}m². Room breakdown: ${roomDetailsText}. Timeframe: ${chatState.timeframe || 'Flexible'}`
            });
            
            // Show summary to user
            setTimeout(() => {
                addMessage(`📋 Summary:
• ${totalRooms} room(s) totaling ${totalSqm.toFixed(1)} square meters
• Service: Underfloor heating installation  
• Timeline: ${chatState.timeframe || 'Flexible'}
• Contact: ${chatState.customerName} (${chatState.customerPhone})`);
            }, 2000);
        }

        // Button handlers
        document.addEventListener('DOMContentLoaded', function() {
            const minimizeBtn = document.getElementById('minimize-btn');
            const closeBtn = document.getElementById('close-btn');

            if (minimizeBtn) {
                minimizeBtn.addEventListener('click', function() {
                    alert('Minimize functionality would hide the chatbot');
                });
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    // Reset chat
                    const messagesContainer = document.getElementById('chatMessages');
                    messagesContainer.innerHTML = '<div class="message bot-message">👋 Welcome to Kiwi Trade! We\'ll ask a couple of quick questions to prepare your underfloor heating quote.</div>';
                    
                    // Reset all state variables
                    chatState = {
                        step: 'welcome',
                        customerName: '',
                        customerEmail: '',
                        customerPhone: '',
                        location: '',
                        areasCount: '',
                        areaSizes: '',
                        timeframe: ''
                    };
                    
                    currentStep = 0;
                    totalRooms = 0;
                    currentRoom = 0;
                    roomDetails = [];
                    
                    // Reset progress bar and checklist
                    updateProgress();
                });
            }

            // Start chat automatically
            setTimeout(() => {
                startChat();
            }, 1000);
        });
    </script>
</body>
</html>
