<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quote - Kiwi Underfloor Heating</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      color:#1f2937; 
      padding: 20px; 
      max-width: 900px; 
      margin: 0 auto;
      line-height: 1.6;
    }
    .header { 
      text-align: center; 
      border-bottom: 3px solid #2c3e50; 
      padding-bottom: 20px; 
      margin-bottom: 30px; 
    }
    .company-name {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
    }
    .quote-title {
      font-size: 24px;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 15px;
    }
    .quote-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }
    .customer-details, .tradesman-details {
      flex: 1;
      min-width: 300px;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .details-title {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }
    .detail-row {
      margin: 8px 0;
      display: flex;
    }
    .detail-label {
      font-weight: bold;
      width: 120px;
      flex-shrink: 0;
    }
    .detail-value {
      flex: 1;
    }
    .breakdown-section {
      margin: 30px 0;
      background: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .breakdown-title {
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    .breakdown-table th {
      background-color: #34495e;
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: bold;
    }
    .breakdown-table td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }
    .breakdown-table tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    .total-section {
      text-align: right;
      margin: 20px 0;
    }
    .total-amount {
      font-size: 24px;
      font-weight: bold;
      color: #27ae60;
    }
    .action-buttons {
      text-align: center;
      margin: 30px 0;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .btn { 
      display: inline-block; 
      text-decoration: none; 
      padding: 12px 24px; 
      border-radius: 6px; 
      color: #fff; 
      margin: 0 10px;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-accept { background: #16a34a; }
    .btn-decline { background: #dc2626; }
    .btn-secondary { background: #374151; }
    .footer {
      margin-top: 30px;
      text-align: center;
      padding: 20px;
      background-color: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .footer-text {
      font-size: 14px;
      color: #666;
      margin: 5px 0;
    }
    @media (max-width: 768px) {
      .quote-info {
        flex-direction: column;
      }
      .customer-details, .tradesman-details {
        min-width: auto;
      }
      .btn {
        display: block;
        margin: 10px 0;
      }
    }
  </style>
</head>
<body>
  <div id="content">
    <div class="header">
      <div class="company-name">KIWI UNDERFLOOR HEATING</div>
      <div class="quote-title">QUOTE</div>
      <div style="display: flex; justify-content: space-between; max-width: 600px; margin: 0 auto; flex-wrap: wrap;">
        <div><strong>Quote Number:</strong> <span id="quoteNumber">Loading...</span></div>
        <div><strong>Date:</strong> <span id="quoteDate">Loading...</span></div>
        <div><strong>Valid Until:</strong> <span id="validUntil">Loading...</span></div>
      </div>
    </div>
    <div id="quoteContent">Loading quote details...</div>
  </div>

  <script>
    (async function() {
      const qs = new URLSearchParams(location.search);
      const quoteId = qs.get('quoteId');
      const leadId = qs.get('leadId');
      const token = qs.get('token');

      function fmt(n){ return '$' + Number(n || 0).toFixed(2); }
      function formatDate(dateString) {
        if (!dateString) return 'Not specified';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-GB');
      }

      try {
        const res = await fetch(`/api/quote-by-id?quoteId=${encodeURIComponent(quoteId)}&leadId=${encodeURIComponent(leadId)}&token=${encodeURIComponent(token)}`);
        const d = await res.json();
        if (!res.ok || !d.ok) throw new Error(d.error || 'Failed to load quote');

        const acceptUrl = `/api/quote-decision?quoteId=${encodeURIComponent(quoteId)}&leadId=${encodeURIComponent(leadId)}&token=${encodeURIComponent(token)}&action=accept`;
        const declineUrl = `/api/quote-decision?quoteId=${encodeURIComponent(quoteId)}&leadId=${encodeURIComponent(leadId)}&token=${encodeURIComponent(token)}&action=decline`;
        const pdfUrl = `/api/quote-pdf?leadId=${encodeURIComponent(leadId)}&token=${encodeURIComponent(token)}&download=1`;

        // Update header info
        document.getElementById('quoteNumber').textContent = d.quoteNumber || d.quoteId;
        document.getElementById('quoteDate').textContent = formatDate(new Date());
        document.getElementById('validUntil').textContent = formatDate(d.validUntil);

        // Calculate totals based on budget
        const budget = parseFloat(d.budget) || 5000;
        const materials = Math.round(budget * 0.6);
        const labor = Math.round(budget * 0.3);
        const installation = Math.round(budget * 0.1);

        document.getElementById('quoteContent').innerHTML = `
          <div class="quote-info">
            <div class="customer-details">
              <div class="details-title">Customer Details</div>
              <div class="detail-row">
                <span class="detail-label">Name:</span>
                <span class="detail-value">${d.customerName || 'Not provided'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Email:</span>
                <span class="detail-value">${d.customerEmail || 'Not provided'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Phone:</span>
                <span class="detail-value">${d.customerPhone || 'Not provided'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Address:</span>
                <span class="detail-value">${d.location || 'Not provided'}</span>
              </div>
            </div>
            
            <div class="tradesman-details">
              <div class="details-title">Tradesman Details</div>
              <div class="detail-row">
                <span class="detail-label">Company:</span>
                <span class="detail-value">Kiwi Underfloor Heating</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Email:</span>
                <span class="detail-value">info@kiwitrade.co.nz</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Phone:</span>
                <span class="detail-value">021 123 456</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Service:</span>
                <span class="detail-value">${d.serviceType || 'Underfloor Heating'}</span>
              </div>
            </div>
          </div>
          
          <div class="breakdown-section">
            <div class="breakdown-title">Quote Breakdown</div>
            <table class="breakdown-table">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Description</th>
                  <th>Amount</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Materials</td>
                  <td>Underfloor heating materials and components</td>
                  <td>$${materials}</td>
                </tr>
                <tr>
                  <td>Labor</td>
                  <td>Professional installation services</td>
                  <td>$${labor}</td>
                </tr>
                <tr>
                  <td>Installation</td>
                  <td>System setup and configuration</td>
                  <td>$${installation}</td>
                </tr>
              </tbody>
            </table>
            
            <div class="total-section">
              <div class="total-amount">Total Amount: $${budget}</div>
            </div>
          </div>
          
          ${d.specificDetails ? `
          <div style="margin: 30px 0; padding: 20px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e5e7eb;">
            <div style="font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 10px;">Additional Notes</div>
            <p>${d.specificDetails}</p>
          </div>
          ` : ''}
          
          <div class="action-buttons">
            <a class="btn btn-accept" href="${acceptUrl}">Accept Quote</a>
            <a class="btn btn-decline" href="${declineUrl}">Decline Quote</a>
            <a class="btn btn-secondary" href="${pdfUrl}">Download Quote</a>
          </div>
          
          <div class="footer">
            <div class="footer-text">Kiwi Underfloor Heating</div>
            <div class="footer-text">Professional underfloor heating solutions for your home</div>
            <div class="footer-text">This quote was generated using our automated system</div>
            <div class="footer-text">Thank you for choosing Kiwi Underfloor Heating!</div>
            <div class="footer-text" style="margin-top: 15px; font-size: 12px;">Lead ID: ${d.leadId}</div>
          </div>
        `;
      } catch(e) {
        console.error(e);
        document.getElementById('content').innerHTML = `
          <div style="text-align: center; padding: 40px; color: #dc2626;">
            <h2>Failed to load quote</h2>
            <p>Please check the quote link and try again.</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
