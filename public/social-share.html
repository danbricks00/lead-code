<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 418px;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .content {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            font-weight: bold;
        }
        p {
            font-size: 1.2rem;
            margin: 0;
            opacity: 0.9;
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="logo">🔥 Heat NZ</div>
        <h1>Underfloor Heating Auckland</h1>
        <p>Professional Installation & Service</p>
    </div>
</body>
</html>
