<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Google Sheets Structure</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .result {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Google Sheets Structure Analysis</h1>
    <button onclick="testSheetsStructure()">Test Google Sheets Structure</button>
    <div id="result"></div>

    <script>
        async function testSheetsStructure() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">Testing Google Sheets structure...</div>';
            
            try {
                const response = await fetch('/api/test-sheets-structure', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = '<div class="result">' + JSON.stringify(data.analysis, null, 2) + '</div>';
                } else {
                    resultDiv.innerHTML = '<div class="result">Error: ' + JSON.stringify(data, null, 2) + '</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<div class="result">Error: ' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
