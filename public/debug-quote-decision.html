<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debug Quote Decision</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #f8f9fa;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Debug Quote Decision</h1>
  <p>Use this page to debug why quotes are not found when customers click Accept/Decline buttons.</p>
  
  <form id="debugForm">
    <div class="form-group">
      <label for="quoteId">Quote ID:</label>
      <input type="text" id="quoteId" name="quoteId" placeholder="e.g., QUOTE-1755300946824-fdd04hk9s" required>
    </div>
    
    <div class="form-group">
      <label for="leadId">Lead ID:</label>
      <input type="text" id="leadId" name="leadId" placeholder="e.g., LEAD-1755300767307-0a5tonlq2" required>
    </div>
    
    <div class="form-group">
      <label for="action">Action:</label>
      <select id="action" name="action" required>
        <option value="accept">Accept</option>
        <option value="decline">Decline</option>
      </select>
    </div>
    
    <button type="submit">Debug Quote Decision</button>
  </form>
  
  <div id="result" class="result" style="display: none;"></div>

  <script>
    document.getElementById('debugForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const quoteId = document.getElementById('quoteId').value;
      const leadId = document.getElementById('leadId').value;
      const action = document.getElementById('action').value;
      
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.textContent = 'Loading...';
      
      try {
        const response = await fetch(`/api/debug-quote-decision?quoteId=${encodeURIComponent(quoteId)}&leadId=${encodeURIComponent(leadId)}&action=${encodeURIComponent(action)}`);
        const data = await response.json();
        
        resultDiv.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        resultDiv.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
