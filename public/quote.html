<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quote - Kiwi Underfloor Heating</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      color:#1f2937; 
      padding: 20px; 
      max-width: 900px; 
      margin: 0 auto;
      line-height: 1.6;
    }
    .header { 
      text-align: center; 
      border-bottom: 3px solid #2c3e50; 
      padding-bottom: 20px; 
      margin-bottom: 30px; 
    }
    .company-name {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
    }
    .quote-title {
      font-size: 24px;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 15px;
    }
    .quote-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }
    .customer-details, .tradesman-details {
      flex: 1;
      min-width: 300px;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .details-title {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }
    .detail-row {
      margin: 8px 0;
      display: flex;
    }
    .detail-label {
      font-weight: bold;
      width: 120px;
      flex-shrink: 0;
    }
    .detail-value {
      flex: 1;
    }
    .breakdown-section {
      margin: 30px 0;
      background: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .breakdown-title {
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
                    .breakdown-table th {
                  background-color: #34495e;
                  color: white;
                  padding: 8px;
                  text-align: left;
                  font-weight: bold;
                  font-size: 14px;
                }
                .breakdown-table td {
                  padding: 8px;
                  border-bottom: 1px solid #ddd;
                  font-size: 14px;
                }
    .breakdown-table tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    .total-section {
      text-align: right;
      margin: 20px 0;
    }
    .total-amount {
      font-size: 24px;
      font-weight: bold;
      color: #27ae60;
    }
    .action-buttons {
      text-align: center;
      margin: 30px 0;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .btn { 
      display: inline-block; 
      text-decoration: none; 
      padding: 12px 24px; 
      border-radius: 6px; 
      color: #fff; 
      margin: 0 10px;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-accept { background: #16a34a; }
    .btn-decline { background: #dc2626; }
    .btn-secondary { background: #374151; }
    .footer {
      margin-top: 30px;
      text-align: center;
      padding: 20px;
      background-color: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .footer-text {
      font-size: 14px;
      color: #666;
      margin: 5px 0;
    }
    @media (max-width: 768px) {
      .quote-info {
        flex-direction: column;
      }
      .customer-details, .tradesman-details {
        min-width: auto;
      }
      .btn {
        display: block;
        margin: 10px 0;
      }
    }
  </style>
</head>
<body>
  <div id="content">
    <div class="header">
      <div class="company-name">KIWI UNDERFLOOR HEATING</div>
      <div class="quote-title">QUOTE</div>
      <div style="display: flex; justify-content: space-between; max-width: 600px; margin: 0 auto; flex-wrap: wrap;">
        <div><strong>Quote Number:</strong> <span id="quoteNumber">Loading...</span></div>
        <div><strong>Date:</strong> <span id="quoteDate">Loading...</span></div>
        <div><strong>Valid Until:</strong> <span id="validUntil">Loading...</span></div>
      </div>
    </div>
    <div id="quoteContent">Loading quote details...</div>
  </div>

  <script>
    (async function() {
      const qs = new URLSearchParams(location.search);
      const quoteId = qs.get('quoteId');
      const leadId = qs.get('leadId');
      const token = qs.get('token');

      function fmt(n){ return '$' + Number(n || 0).toFixed(2); }
      function formatDate(dateString) {
        if (!dateString) return 'Not specified';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-GB');
      }

      try {
        console.log('🔍 Loading quote with:', { quoteId, leadId, token });
        const res = await fetch(`/api/get-quote-by-id?quoteId=${encodeURIComponent(quoteId)}&leadId=${encodeURIComponent(leadId)}&token=${encodeURIComponent(token)}`);
        const d = await res.json();
        console.log('📥 Quote API response:', d);
        
        if (!res.ok || !d.success) {
          console.error('❌ Quote API error:', d.error || 'Failed to load quote');
          throw new Error(d.error || 'Failed to load quote');
        }

        const quote = d.quote;
        
        // If quote data is missing, try to load lead data as fallback
        if (!quote || !quote.customerName) {
          console.log('⚠️ Quote data incomplete, trying to load lead data...');
          try {
            const leadRes = await fetch(`/api/get-lead-by-id?leadId=${encodeURIComponent(leadId)}`);
            const leadData = await leadRes.json();
            if (leadData.success && leadData.lead) {
              console.log('✅ Lead data loaded as fallback');
              // Merge lead data with quote data
              Object.assign(quote, leadData.lead);
            }
          } catch (leadError) {
            console.error('❌ Failed to load lead data:', leadError);
          }
        }
        const acceptUrl = quote.acceptUrl || `/api/quote-decision?quoteId=${encodeURIComponent(quoteId)}&leadId=${encodeURIComponent(leadId)}&token=${encodeURIComponent(token)}&action=accept`;
        const declineUrl = quote.declineUrl || `/api/quote-decision?quoteId=${encodeURIComponent(quoteId)}&leadId=${encodeURIComponent(leadId)}&token=${encodeURIComponent(token)}&action=decline`;
        const pdfUrl = `/api/quote-pdf?leadId=${encodeURIComponent(leadId)}&token=${encodeURIComponent(token)}&download=1`;

        // Update header info
        document.getElementById('quoteNumber').textContent = quote.quoteId || quoteId;
        document.getElementById('quoteDate').textContent = formatDate(quote.timestamp);
        document.getElementById('validUntil').textContent = formatDate(new Date(Date.now() + 30 * 24 * 60 * 60 * 1000));

        // Use actual quote data
        const materials = parseFloat(quote.materialSubtotal) || 0;
        const labor = parseFloat(quote.labourSubtotal) || 0;
        const installation = parseFloat(quote.installationSubtotal) || 0;
        const total = parseFloat(quote.quoteAmount) || 0;

        document.getElementById('quoteContent').innerHTML = `
          <div class="quote-info">
            <div class="customer-details">
              <div class="details-title">Customer Details</div>
              <div class="detail-row">
                <span class="detail-label">Name:</span>
                <span class="detail-value">${quote.customerName || 'Not provided'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Email:</span>
                <span class="detail-value">${quote.customerEmail || 'Not provided'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Phone:</span>
                <span class="detail-value">${quote.customerPhone || 'Not provided'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Address:</span>
                <span class="detail-value">${quote.location || 'Not provided'}</span>
              </div>
            </div>
            
            <div class="tradesman-details">
              <div class="details-title">Tradesman Details</div>
              <div class="detail-row">
                <span class="detail-label">Company:</span>
                <span class="detail-value">${quote.tradesmanName || 'Kiwi Underfloor Heating'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Email:</span>
                <span class="detail-value">${quote.tradesmanEmail || 'info@kiwitrade.co.nz'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Phone:</span>
                <span class="detail-value">${quote.tradesmanPhone || '021 123 456'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Service:</span>
                <span class="detail-value">${quote.serviceType || 'Underfloor Heating'}</span>
              </div>
            </div>
          </div>
          
                     <div class="breakdown-section">
             <div class="breakdown-title">Quote Breakdown</div>
             <table class="breakdown-table">
               <thead>
                 <tr>
                   <th>Item</th>
                   <th>Description</th>
                   <th>Rate per Hour/Unit</th>
                   <th>Amount of Hours/Unit</th>
                   <th>Amount</th>
                 </tr>
               </thead>
               <tbody>
                 ${materials > 0 ? `
                 <tr>
                   <td>Materials</td>
                   <td>Underfloor heating materials and components</td>
                   <td>$${parseFloat(quote.materialRate || 0).toFixed(2)} per SQM</td>
                   <td>${parseFloat(quote.materialSQM || 0).toFixed(1)} SQM</td>
                   <td>$${materials.toFixed(2)}</td>
                 </tr>
                 ` : ''}
                 ${labor > 0 ? `
                 <tr>
                   <td>Labor</td>
                   <td>Professional installation services</td>
                   <td>$${parseFloat(quote.labourRate || 0).toFixed(2)} per hour</td>
                   <td>${parseFloat(quote.labourHours || 0).toFixed(1)} hours</td>
                   <td>$${labor.toFixed(2)}</td>
                 </tr>
                 ` : ''}
                 ${installation > 0 ? `
                 <tr>
                   <td>Installation</td>
                   <td>System setup and configuration</td>
                   <td>Fixed cost</td>
                   <td>-</td>
                   <td>$${installation.toFixed(2)}</td>
                 </tr>
                 ` : ''}
               </tbody>
             </table>
            
            <div class="total-section">
              <div class="total-amount">Total Amount: $${total.toFixed(2)}</div>
            </div>
          </div>
          
          ${quote.notes ? `
          <div style="margin: 30px 0; padding: 20px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e5e7eb;">
            <div style="font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 10px;">Additional Notes</div>
            <p>${quote.notes}</p>
          </div>
          ` : ''}
          
          <div class="action-buttons">
            <a class="btn btn-accept" href="${acceptUrl}">Accept Quote</a>
            <a class="btn btn-decline" href="${declineUrl}">Decline Quote</a>
            <a class="btn btn-secondary" href="${pdfUrl}">Download Quote</a>
          </div>
          
          <div class="footer">
            <div class="footer-text">Kiwi Underfloor Heating</div>
            <div class="footer-text">Professional underfloor heating solutions for your home</div>
            <div class="footer-text">This quote was generated using our automated system</div>
            <div class="footer-text">Thank you for choosing Kiwi Underfloor Heating!</div>
            <div class="footer-text" style="margin-top: 15px; font-size: 12px;">Quote ID: ${quote.quoteId}</div>
          </div>
        `;
      } catch(e) {
        console.error(e);
        document.getElementById('content').innerHTML = `
          <div style="text-align: center; padding: 40px; color: #dc2626;">
            <h2>Failed to load quote</h2>
            <p>Please check the quote link and try again.</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
