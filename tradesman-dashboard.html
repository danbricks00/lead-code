<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradesman Dashboard - Quote Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total { color: #2c3e50; }
        .accepted { color: #27ae60; }
        .declined { color: #e74c3c; }
        .awarded { color: #6c757d; }
        .sent { color: #3498db; }
        .pending { color: #f39c12; }
        .value { color: #8e44ad; }
        .commission { color: #16a085; }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .email-input {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .email-input input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .email-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e1e8ed;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .quotes-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .quotes-header {
            background: #f8f9fa;
            padding: 20px 25px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quotes-header h3 {
            color: #2c3e50;
            font-size: 1.3rem;
        }

        .quotes-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .quote-item {
            padding: 20px 25px;
            border-bottom: 1px solid #e1e8ed;
            transition: background-color 0.3s ease;
        }

        .quote-item:hover {
            background: #f8f9fa;
        }

        .quote-item:last-child {
            border-bottom: none;
        }

        .quote-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .quote-info h4 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .quote-meta {
            color: #666;
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-accepted {
            background: #d4edda;
            color: #155724;
        }

        .status-declined {
            background: #f8d7da;
            color: #721c24;
        }

        .status-awarded {
            background: #e2e3e5;
            color: #383d41;
        }

        .status-sent {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .quote-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .detail-value {
            font-weight: 600;
            color: #2c3e50;
        }

        .quote-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-info {
            background: #3498db;
            color: white;
        }

        .btn-info:hover {
            background: #2980b9;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .email-input {
                flex-direction: column;
                align-items: stretch;
            }

            .filters {
                justify-content: center;
            }

            .quote-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .quote-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Tradesman Dashboard</h1>
            <p>Manage your quotes and track your business performance</p>
        </div>

        <div class="controls">
            <div class="email-input">
                <input type="email" id="tradesmanEmail" placeholder="Enter your tradesman email address" required>
                <button class="btn btn-primary" onclick="loadQuotes()">Load My Quotes</button>
            </div>

            <div class="filters" id="filters" style="display: none;">
                <button class="filter-btn active" data-filter="all">All Quotes</button>
                <button class="filter-btn" data-filter="quote_sent">Quote Sent</button>
                <button class="filter-btn" data-filter="customer_accepted">Accepted</button>
                <button class="filter-btn" data-filter="customer_declined">Declined</button>
                <button class="filter-btn" data-filter="job_awarded_to_another">Awarded to Another</button>
                <button class="filter-btn" data-filter="generated">Pending</button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid" style="display: none;">
            <div class="stat-card">
                <div class="stat-number total" id="totalQuotes">0</div>
                <div class="stat-label">Total Quotes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number sent" id="quoteSent">0</div>
                <div class="stat-label">Quote Sent</div>
            </div>
            <div class="stat-card">
                <div class="stat-number accepted" id="acceptedQuotes">0</div>
                <div class="stat-label">Accepted</div>
            </div>
            <div class="stat-card">
                <div class="stat-number declined" id="declinedQuotes">0</div>
                <div class="stat-label">Declined</div>
            </div>
            <div class="stat-card">
                <div class="stat-number awarded" id="awardedQuotes">0</div>
                <div class="stat-label">Awarded to Another</div>
            </div>
            <div class="stat-card">
                <div class="stat-number pending" id="pendingQuotes">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number value" id="totalValue">$0</div>
                <div class="stat-label">Total Value</div>
            </div>
            <div class="stat-card">
                <div class="stat-number commission" id="totalCommission">$0</div>
                <div class="stat-label">Commission Earned</div>
            </div>
        </div>

        <div class="quotes-container" id="quotesContainer" style="display: none;">
            <div class="quotes-header">
                <h3>📋 My Quotes</h3>
                <span id="quotesCount">0 quotes</span>
            </div>
            <div class="quotes-list" id="quotesList">
                <!-- Quotes will be loaded here -->
            </div>
        </div>

        <div id="loadingMessage" class="loading" style="display: none;">
            <h3>🔄 Loading your quotes...</h3>
            <p>Please wait while we fetch your quote data.</p>
        </div>

        <div id="errorMessage" class="error" style="display: none;">
            <!-- Error messages will appear here -->
        </div>
    </div>

    <script>
        let allQuotes = [];
        let currentFilter = 'all';

        async function loadQuotes() {
            const email = document.getElementById('tradesmanEmail').value.trim();
            
            if (!email) {
                showError('Please enter your tradesman email address.');
                return;
            }

            showLoading(true);
            hideError();

            try {
                const response = await fetch('/api/get-quotes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (result.success) {
                    allQuotes = result.quotes;
                    updateStats(result.summary);
                    displayQuotes(allQuotes);
                    showDashboard();
                } else {
                    showError(`Failed to load quotes: ${result.error}`);
                }
            } catch (error) {
                console.error('Error loading quotes:', error);
                showError('Failed to load quotes. Please check your connection and try again.');
            } finally {
                showLoading(false);
            }
        }

        function updateStats(summary) {
            document.getElementById('totalQuotes').textContent = summary.total;
            document.getElementById('quoteSent').textContent = summary.quoteSent;
            document.getElementById('acceptedQuotes').textContent = summary.accepted;
            document.getElementById('declinedQuotes').textContent = summary.declined;
            document.getElementById('awardedQuotes').textContent = summary.jobAwardedToAnother;
            document.getElementById('pendingQuotes').textContent = summary.pending;
            document.getElementById('totalValue').textContent = `$${summary.totalValue}`;
            document.getElementById('totalCommission').textContent = `$${summary.totalCommission}`;
        }

        function displayQuotes(quotes) {
            const quotesList = document.getElementById('quotesList');
            const quotesCount = document.getElementById('quotesCount');

            if (quotes.length === 0) {
                quotesList.innerHTML = `
                    <div class="empty-state">
                        <h3>📭 No quotes found</h3>
                        <p>You don't have any quotes matching the current filter.</p>
                    </div>
                `;
                quotesCount.textContent = '0 quotes';
                return;
            }

            quotesCount.textContent = `${quotes.length} quote${quotes.length !== 1 ? 's' : ''}`;

            quotesList.innerHTML = quotes.map(quote => `
                <div class="quote-item">
                    <div class="quote-header">
                        <div class="quote-info">
                            <h4>${quote.QuoteNumber || quote.quoteNumber || 'Quote'}</h4>
                            <div class="quote-meta">
                                ${quote.CustomerName || quote.customerName} • ${quote.ServiceType || quote.serviceType}
                            </div>
                        </div>
                        <span class="status-badge ${getStatusClass(quote.Status || quote.status)}">
                            ${getStatusText(quote.Status || quote.status)}
                        </span>
                    </div>
                    
                    <div class="quote-details">
                        <div class="detail-item">
                            <span class="detail-label">Customer</span>
                            <span class="detail-value">${quote.CustomerName || quote.customerName}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Service</span>
                            <span class="detail-value">${quote.ServiceType || quote.serviceType}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Amount</span>
                            <span class="detail-value">$${quote.TotalAmount || quote.total || '0.00'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Date</span>
                            <span class="detail-value">${formatDate(quote.Timestamp || quote.date)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Customer Email</span>
                            <span class="detail-value">${quote.CustomerEmail || quote.customerEmail}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Commission</span>
                            <span class="detail-value">$${quote.CommissionEarned || '0.00'}</span>
                        </div>
                    </div>

                    <div class="quote-actions">
                        <a href="/api/generate-quote?quoteId=${quote.QuoteID || quote.quoteId}" 
                           class="btn btn-small btn-info" target="_blank">
                            📄 View Quote
                        </a>
                        ${(quote.Status || quote.status) === 'quote_sent' ? `
                            <button class="btn btn-small btn-warning" onclick="resendQuote('${quote.QuoteID || quote.quoteId}')">
                                📧 Resend Quote
                            </button>
                        ` : ''}
                        ${(quote.Status || quote.status) === 'customer_accepted' ? `
                            <button class="btn btn-small btn-success" onclick="contactCustomer('${quote.CustomerEmail || quote.customerEmail}')">
                                📞 Contact Customer
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function getStatusClass(status) {
            switch (status) {
                case 'customer_accepted': return 'status-accepted';
                case 'customer_declined': return 'status-declined';
                case 'job_awarded_to_another': return 'status-awarded';
                case 'quote_sent': return 'status-sent';
                case 'generated': return 'status-pending';
                default: return 'status-pending';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'customer_accepted': return 'Accepted';
                case 'customer_declined': return 'Declined';
                case 'job_awarded_to_another': return 'Awarded to Another';
                case 'quote_sent': return 'Quote Sent';
                case 'generated': return 'Pending';
                default: return 'Pending';
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-NZ', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
        }

        function showDashboard() {
            document.getElementById('statsGrid').style.display = 'grid';
            document.getElementById('quotesContainer').style.display = 'block';
            document.getElementById('filters').style.display = 'flex';
        }

        function showLoading(show) {
            document.getElementById('loadingMessage').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        function resendQuote(quoteId) {
            // This would trigger a resend of the quote email
            alert(`Resend functionality for quote ${quoteId} would be implemented here.`);
        }

        function contactCustomer(email) {
            // This would open email client or contact form
            window.open(`mailto:${email}?subject=Regarding your accepted quote`, '_blank');
        }

        // Filter functionality
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('filter-btn')) {
                // Update active filter button
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');

                // Apply filter
                currentFilter = e.target.dataset.filter;
                applyFilter();
            }
        });

        function applyFilter() {
            let filteredQuotes = allQuotes;

            if (currentFilter !== 'all') {
                filteredQuotes = allQuotes.filter(quote => 
                    (quote.Status || quote.status) === currentFilter
                );
            }

            displayQuotes(filteredQuotes);
        }

        // Enter key support for email input
        document.getElementById('tradesmanEmail').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadQuotes();
            }
        });
    </script>
</body>
</html>
