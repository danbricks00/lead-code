<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat NZ Social Share Image</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 418px;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }
        
        .logo {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .headline {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .subheading {
            font-size: 1.4rem;
            font-weight: 400;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .fire-emoji {
            font-size: 5rem;
            margin-right: 0.5rem;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>
    <div class="logo">
        <span class="fire-emoji">🔥</span>Heat NZ
    </div>
    <div class="headline">Underfloor Heating Auckland</div>
    <div class="subheading">Professional Installation & Service</div>
</body>
</html>
